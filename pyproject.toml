[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caseops"
version = "0.1.0"
description = "Tenant-aware support ticket orchestration and knowledge feedback loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langgraph>=1.0.10,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.14.2,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
infra = [
  "pymilvus>=2.5,<4.0",
  "redis>=5.2,<9.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=6.0,<8.0",
]

[project.scripts]
caseops-api = "caseops.api:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

